<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐶 AI 수의사 상담소</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 400px; height: 600px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        #header { background: #4CAF50; color: white; padding: 15px; text-align: center; font-size: 1.2em; font-weight: bold; }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; font-size: 0.95em; }
        .user-msg { background: #DCF8C6; align-self: flex-end; border-bottom-right-radius: 0; }
        .bot-msg { background: #E8E8E8; align-self: flex-start; border-bottom-left-radius: 0; white-space: pre-wrap; }
        #input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; background: #fff; }
        #user-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        #send-btn { background: #4CAF50; color: white; border: none; padding: 10px 15px; margin-left: 10px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        #send-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">🐶 AI 수의사 상담소</div>
    <div id="chat-box">
        <div class="message bot-msg">안녕하세요! 반려견의 증상을 편하게 말씀해 주세요.</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="예: 강아지가 설사를 해요" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">전송</button>
    </div>
</div>

<script>
    function sendMessage() {
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBox = document.getElementById('chat-box');
        const text = inputField.value.trim();
        
        if (!text) return;

        // 1. 유저 메시지 띄우기 및 버튼 비활성화
        appendMessage(text, 'user-msg');
        inputField.value = '';
        inputField.disabled = true;
        sendBtn.disabled = true;

        // 2. AI가 타이핑할 빈 말풍선 미리 만들기
        const msgId = 'msg-' + Date.now();
        appendMessage('', 'bot-msg', msgId);
        const aiMessageDiv = document.getElementById(msgId);

        // 3. 🌟 서버와 스트리밍 파이프 연결 (Server-Sent Events)
        const eventSource = new EventSource('http://localhost:8080/ask?q=' + encodeURIComponent(text));

        // 서버에서 글자 조각이 날아올 때마다 실행됨!
        eventSource.onmessage = function(event) {
            // 서버가 "[DONE]" 신호를 보내면 연결 끊기
            if (event.data === "[DONE]") {
                eventSource.close();
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
                return;
            }

            try {
                // 날아온 JSON 전체 문장으로 화면 통째로 덮어씌우기
                const data = JSON.parse(event.data);
                aiMessageDiv.innerText = data.text; // 🌟 '+' 기호를 지우고 '=' 만 남겨주세요!
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {
                console.error("데이터 파싱 에러:", e);
            }
        };

        // 통신 중 에러가 발생했을 때
        eventSource.onerror = function() {
            eventSource.close();
            aiMessageDiv.innerText += "\n[서버와의 연결이 끊어졌습니다.]";
            inputField.disabled = false;
            sendBtn.disabled = false;
        };
    }

    // 🌟 이 함수가 꼭 있어야 화면에 말풍선이 그려집니다!
    function appendMessage(text, className, id = '') {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + className;
        msgDiv.innerText = text;
        if (id) msgDiv.id = id;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
